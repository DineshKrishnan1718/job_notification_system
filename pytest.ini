[pytest]
# Adds the root directory to the python path so 'app.something' imports work
pythonpath = .
# Standard CLI options (verbose, detailed tracebacks)
addopts = -v --tb=short
# Define markers to run specific test suites (e.g., pytest -m "unit")
markers =
    unit: Fast tests that don't hit the DB or Network
    integration: Slower tests that check DB/File interactions
    e2e: End-to-end tests checking the whole pipeline