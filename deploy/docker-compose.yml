services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: $${POSTGRES_USER:-job_user}
      POSTGRES_PASSWORD: $${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: $${POSTGRES_DB:-job_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://$${POSTGRES_USER:-job_user}:$${POSTGRES_PASSWORD:-change_me}@db:5432/$${POSTGRES_DB:-job_database}
    volumes:
      - ../logs:/app/logs
    restart: unless-stopped
volumes:
  postgres_data:
